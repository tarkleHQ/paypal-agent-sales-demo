# Render Blueprint. Connect the repo in Render and it creates this service.
# Free instances sleep when idle and the app keeps orders in memory, so use a paid instance
# (plan: starter) while judges test, and never run more than one instance.
services:
  - type: web
    name: paypal-agent-sales-demo
    runtime: node
    plan: free
    numInstances: 1
    buildCommand: npm install --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MCP_TOKEN        # bearer token an MCP client must send to /mcp
        generateValue: true
      - key: PAYPAL_CLIENT_ID # PayPal sandbox REST app. Set in the Render dashboard.
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID # id of the webhook you register for <service url>/paypal/webhook
        sync: false
      - key: ZAPIER_WEBHOOK_URL # optional Zapier Catch Hook for job.paid, job.delivered and job.refunded
        sync: false
      # Optional: deliver into the client's real Tarkle client portal instead of this app's gallery page.
      - key: TARKLE_API_BASE # e.g. https://tarkle.com/api/v1 (or the preview that serves the portal-delivery routes)
        sync: false
      - key: TARKLE_API_KEY # a Tarkle API key from Settings > API, for a workspace on Pro
        sync: false
      - key: TARKLE_WORKSPACE_KEY # the workspace's 8-character key
        sync: false
      - key: TARKLE_PORTAL_URL # the client portal address shown to clients, e.g. https://yourstudio.tarkle.com/portal
        sync: false
